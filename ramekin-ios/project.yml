name: Ramekin
options:
  bundleIdPrefix: com.ramekin
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 32ANM8P9HJ

packages:
  # The OpenAPI generator's Swift template emits `AnyCodable` in the generated
  # ScrapeAPI signatures for endpoints returning `serde_json::Value` (e.g.
  # `/api/scrape/{id}/steps/{step_name}/output`). The generated client's own
  # Package.swift pulls in Flight-School/AnyCodable; mirror that here so the
  # app and share-extension targets have `AnyCodable` in scope.
  AnyCodable:
    url: https://github.com/Flight-School/AnyCodable
    from: 0.6.1

targets:
  Ramekin:
    type: application
    platform: iOS
    sources:
      - path: Ramekin
        excludes:
          - "*.entitlements"
          - Info.plist
      - path: Shared
      - path: generated-client/RamekinClient/Classes/OpenAPIs
    info:
      path: Ramekin/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: AccentColor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramekin.app
        CODE_SIGN_ENTITLEMENTS: Ramekin/Ramekin.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Ramekin/Ramekin.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ramekin.app
        com.apple.developer.associated-domains:
          - applinks:${RAMEKIN_EXTERNAL_HOST}
    dependencies:
      - target: RamekinShareExtension
        embed:
          codeSign: true
      - package: AnyCodable

  RamekinShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: RamekinShareExtension
        excludes:
          - "*.entitlements"
      - path: Shared
      - path: generated-client/RamekinClient/Classes/OpenAPIs
    info:
      path: RamekinShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Ramekin
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
            NSExtensionJavaScriptPreprocessingFile: SharePreprocessor
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramekin.app.share
        CODE_SIGN_ENTITLEMENTS: RamekinShareExtension/RamekinShareExtension.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: RamekinShareExtension/RamekinShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ramekin.app
    dependencies:
      - package: AnyCodable

  RamekinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RamekinTests
    resources:
      - path: ../shared-test-vectors/scale-amount.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramekin.app.tests
    dependencies:
      - target: Ramekin

  RamekinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RamekinUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ramekin.app.uitests
    dependencies:
      - target: Ramekin

schemes:
  Ramekin:
    build:
      targets:
        Ramekin: all
        RamekinShareExtension: all
        RamekinTests: [test]
        RamekinUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RamekinTests
        - RamekinUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
