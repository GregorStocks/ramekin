---
name: iOS

"on":
  pull_request:
    branches: ["*"]
    paths:
      - 'ramekin-ios/**'
      - 'shared-test-vectors/**'
      - '.github/workflows/ios.yml'
      # CI runs the iOS build through make targets, so changes to them (and
      # the simulator picker they call) need this job to run.
      - 'Makefile'
      - 'scripts/find-ios-simulator.py'
      - 'scripts/prepare-ios-ui-simulator.sh'
  # Caches saved by pull_request runs are visible only to reruns of that PR.
  # Build the backend on master too, so every PR can restore its cache. Keep
  # these paths in sync with the backend cache key below.
  push:
    branches: [master]
    paths:
      - 'rust-toolchain.toml'
      - 'server/**'
      - 'cli/**'
      - 'ramekin-core/**'
      - 'migrations/**'
      - 'data/ingredients.json'
      - 'shared-test-vectors/**'
      - 'Makefile'
      - '.github/workflows/ios.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests run in their own job, without the backend stack, so a UI-test
  # host stall on a slow simulator can never fail the unit suite (and a UI
  # flake rerun doesn't rebuild/reseed anything it doesn't need).
  ios-unit:
    name: iOS Unit Tests
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    # Backstop only: the step timeouts below are the real limits. A step that
    # times out fails (rather than the whole job being cancelled), so the
    # result upload still runs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install xcodegen

      - name: Run unit tests
        timeout-minutes: 25
        run: make ios-test

      - name: Upload test results on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-results
          path: logs/*.xcresult
          if-no-files-found: ignore

  # The UI test job needs a release server, a seeding CLI and the built app.
  # Each build gets its own runner so they run in parallel, and the test job
  # only downloads them. Rerunning a failed test job reuses these artifacts.
  ios-ui-build-backend:
    name: iOS UI Tests / Build backend
    runs-on: macos-latest
    # Backstop only, above the sum of the step timeouts below. A step timeout
    # fails the step, so the Rust cache (cache-on-failure) still saves; a job
    # timeout cancels the job and loses the cold build.
    timeout-minutes: 45
    env:
      # Help the linker find libpq from Homebrew.
      LIBRARY_PATH: /opt/homebrew/opt/postgresql@16/lib
      PQ_LIB_DIR: /opt/homebrew/opt/postgresql@16/lib
    steps:
      - uses: actions/checkout@v4

      # The binaries depend only on these inputs, so a PR that leaves the Rust
      # side alone (most iOS PRs) skips the Rust build entirely. Keep this list
      # in sync with what the server and CLI compile in (crate sources,
      # embed_migrations!, include_str! of files outside the crates) and how
      # they are built (Makefile, this workflow).
      # The env context can't see runner variables like ImageOS, so read it
      # here. A new macOS image can ship different Homebrew libpq.
      - name: Read runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Restore backend binaries
        id: backend-cache
        uses: actions/cache/restore@v6
        with:
          path: ios-ui-backend.tar
          key: >-
            ios-ui-backend-${{ steps.image.outputs.os }}-${{ runner.arch }}-${{ hashFiles(
              'rust-toolchain.toml', 'server/**', 'cli/**', 'ramekin-core/**',
              'migrations/**', 'data/ingredients.json', 'shared-test-vectors/**',
              'Makefile', '.github/workflows/ios.yml') }}

      - name: Install dependencies
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: brew install postgresql@16

      - name: Install Rust
        if: steps.backend-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        if: steps.backend-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            cli -> target
            ramekin-core -> target
          shared-key: ios-ci
          cache-on-failure: true

      - name: Build server
        if: steps.backend-cache.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: make server-release-build

      - name: Build CLI
        if: steps.backend-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        # This CLI only seeds test data. Avoid a second optimized Rust build
        # consuming the job budget on a cold cache.
        run: make cli/target/debug/ramekin-cli

      # tar keeps the executable bits, which upload-artifact drops.
      - name: Package binaries
        if: steps.backend-cache.outputs.cache-hit != 'true'
        run: tar -cf ios-ui-backend.tar server/target/release/ramekin-server cli/target/debug/ramekin-cli

      # Save right away rather than in a post-step, so a later failure or
      # cancellation can't throw away the build.
      - name: Save backend binaries
        if: steps.backend-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ios-ui-backend.tar
          key: ${{ steps.backend-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: ios-ui-backend
          path: ios-ui-backend.tar
          retention-days: 3

  ios-ui-build-app:
    name: iOS UI Tests / Build app
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install xcodegen

      - name: Build app and UI tests
        timeout-minutes: 20
        run: make ios-build-ui-tests

      # Products holds the .xctestrun plus the app and test-runner bundles;
      # tar keeps the bundles' executable bits and symlinks.
      - name: Package build products
        run: tar -cf ios-ui-app.tar ramekin-ios/build/ui-tests/Build/Products

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ui-app
          path: ios-ui-app.tar
          retention-days: 3

  ios-ui:
    name: iOS UI Tests
    needs: [ios-ui-build-backend, ios-ui-build-app]
    runs-on: macos-latest
    # Backstop only, above the sum of the step timeouts below. A step timeout
    # fails the step (rather than the whole job being cancelled), so the
    # diagnostics upload still runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Start runner load sampler
        # A degraded simulator can stop answering accessibility queries for
        # minutes (SpringBoard kAXErrorIPCTimeout). Record runner CPU and
        # memory for the rest of the job, from before the simulator boots
        # through the UI tests, so a failure shows whether the runner was
        # starved and by what.
        run: |
          mkdir -p logs
          # GitHub runs steps with bash -e; a failed sample (memory_pressure,
          # ps) must not end the sampler.
          (set +e; while true; do
            echo "== $(date -u +%H:%M:%S) $(uptime | sed 's/.*load/load/')"
            memory_pressure -Q | tail -1
            ps -Ao pcpu,rss,comm -r | head -12
            sleep 15
          done) > logs/runner-load.log 2>&1 &

      - name: Disable Spotlight indexing
        # mds and mdworker index the build output and cost the runner CPU the
        # simulator needs.
        run: sudo mdutil -a -i off

      - name: Start booting simulator
        # A fresh simulator saturates the runner for minutes after booting;
        # start it now so that overlaps the setup below. See the script.
        run: scripts/prepare-ios-ui-simulator.sh boot >> "$GITHUB_ENV"

      - name: Install dependencies
        run: brew install postgresql@16 uv

      - name: Start PostgreSQL
        run: |
          # Add PostgreSQL binaries to PATH
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"

          # Initialize database if needed
          if [ ! -d "/opt/homebrew/var/postgresql@16" ]; then
            initdb --locale=C -E UTF-8 /opt/homebrew/var/postgresql@16
          fi

          brew services start postgresql@16

          # Wait for postgres to be ready
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "PostgreSQL failed to start"
              exit 1
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Create database and user
        run: |
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          createuser -s ramekin 2>/dev/null || true
          createdb -O ramekin ramekin_ios 2>/dev/null || true

      - uses: actions/download-artifact@v4
        with:
          pattern: ios-ui-*
          merge-multiple: true

      - name: Unpack builds
        run: |
          tar -xf ios-ui-backend.tar
          tar -xf ios-ui-app.tar

      - name: Start mock AI service
        run: |
          mkdir -p logs
          make mock-openrouter MOCK_OPENROUTER_PORT=55002 > logs/mock-openrouter.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:55002/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat logs/mock-openrouter.log
          exit 1

      - name: Start server
        run: |
          cd server
          ./target/release/ramekin-server &
          # Wait for server to be ready
          for i in {1..60}; do
            if curl -s http://localhost:55000/api/test/unauthed-ping > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done
        env:
          DATABASE_URL: postgres://ramekin@localhost:5432/ramekin_ios
          PORT: 55000
          RUST_LOG: error
          INSECURE_PASSWORD_HASHING: 1
          OPENROUTER_API_KEY: test-key
          RAMEKIN_AI_BASE_URL: http://localhost:55002/v1
          RAMEKIN_AI_RATE_LIMIT_MS: 0

      - name: Seed database
        timeout-minutes: 10
        run: |
          ./cli/target/debug/ramekin-cli seed \
            --server-url http://localhost:55000 \
            --username t --password t \
            --tags-file data/eval-tags.json \
            --preserve-tags=false \
            data/dev/seed.paprikarecipes

      - name: Verify seeded recipes are queryable
        run: |
          # Imports run as async server-side jobs; fail here with a clear
          # message if they didn't produce recipes, instead of letting the UI
          # test fail later with an empty recipe list.
          TOKEN=$(curl -s -X POST http://localhost:55000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"t","password":"t"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          for i in {1..24}; do
            TOTAL=$(curl -s "http://localhost:55000/api/recipes?limit=1" \
              -H "Authorization: Bearer $TOKEN" \
              | python3 -c 'import sys, json; print(json.load(sys.stdin)["pagination"]["total"])')
            if [ "$TOTAL" -gt 0 ] 2>/dev/null; then
              echo "Seeded recipes queryable: total=$TOTAL"
              exit 0
            fi
            echo "No recipes queryable yet (total=$TOTAL), waiting... ($i/24)"
            sleep 5
          done
          echo "Seeded recipes never became queryable — import jobs likely failed"
          exit 1

      - name: Configure simulator
        timeout-minutes: 10
        # Finish booting and turn off keyboard extras; see the script.
        # make ios-test-ui uses IOS_UI_DESTINATION from the boot step.
        run: scripts/prepare-ios-ui-simulator.sh configure

      - name: Run UI tests
        timeout-minutes: 20
        run: make ios-test-ui-prebuilt

      - name: Collect simulator system log
        if: failure()
        timeout-minutes: 5
        # The xcresult only has the test runner's side of a stall; the
        # simulator's own log shows what SpringBoard and the app were doing.
        run: |
          xcrun simctl spawn "$IOS_UI_UDID" log show --last 40m --style compact \
            > logs/simulator-system.log 2>&1 || true
          gzip -f logs/simulator-system.log

      - name: Upload UI test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: |
            logs/*.xcresult
            logs/runner-load.log
            logs/simulator-system.log.gz
          if-no-files-found: ignore
