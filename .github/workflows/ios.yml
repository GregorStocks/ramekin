---
name: iOS

"on":
  pull_request:
    branches: ["*"]
    paths:
      - 'ramekin-ios/**'
      - 'shared-test-vectors/**'
      - '.github/workflows/ios.yml'
      # CI runs the iOS build through make targets, so changes to them (and
      # the simulator picker they call) need this job to run.
      - 'Makefile'
      - 'scripts/find-ios-simulator.py'
      - 'scripts/prepare-ios-ui-simulator.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit tests run in their own job, without the backend stack, so a UI-test
  # host stall on a slow simulator can never fail the unit suite (and a UI
  # flake rerun doesn't rebuild/reseed anything it doesn't need).
  ios-unit:
    name: iOS Unit Tests
    runs-on: macos-latest
    # Backstop only: the step timeouts below are the real limits. A step that
    # times out fails (rather than the whole job being cancelled), so the
    # result upload still runs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install xcodegen

      - name: Run unit tests
        timeout-minutes: 25
        run: make ios-test

      - name: Upload test results on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-results
          path: logs/*.xcresult
          if-no-files-found: ignore

  ios-ui:
    name: iOS UI Tests
    runs-on: macos-latest
    # Backstop only, above the sum of the step timeouts below. Hitting a job
    # timeout cancels the job, which skips the cache post-steps and loses the
    # cold build; a step timeout instead fails the step, so diagnostics upload
    # and the Rust cache (cache-on-failure) still saves for the next run.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install xcodegen postgresql@16 uv

      - name: Start PostgreSQL
        run: |
          # Add PostgreSQL binaries to PATH
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"

          # Initialize database if needed
          if [ ! -d "/opt/homebrew/var/postgresql@16" ]; then
            initdb --locale=C -E UTF-8 /opt/homebrew/var/postgresql@16
          fi

          brew services start postgresql@16

          # Wait for postgres to be ready
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 2>/dev/null; then
              echo "PostgreSQL is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "PostgreSQL failed to start"
              exit 1
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 1
          done

      - name: Create database and user
        run: |
          export PATH="/opt/homebrew/opt/postgresql@16/bin:$PATH"
          createuser -s ramekin 2>/dev/null || true
          createdb -O ramekin ramekin_ios 2>/dev/null || true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server -> target
            cli -> target
            ramekin-core -> target
          shared-key: ios-ci
          cache-on-failure: true

      - name: Restore cargo binaries
        id: cargo-bin-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin
          key: cargo-bin-macos-diesel-3.2

      - name: Install diesel CLI
        timeout-minutes: 10
        run: |
          if ! command -v diesel &> /dev/null; then
            echo "Installing diesel_cli..."
            cargo install diesel_cli --no-default-features --features postgres
          else
            echo "diesel_cli already cached"
          fi
        env:
          # Help linker find libpq from Homebrew
          LIBRARY_PATH: /opt/homebrew/opt/postgresql@16/lib:/usr/local/opt/postgresql@16/lib
          PQ_LIB_DIR: /opt/homebrew/opt/postgresql@16/lib

      # Save right away rather than in a post-step, so a later failure or
      # cancellation can't throw away the diesel_cli build.
      - name: Save cargo binaries
        if: steps.cargo-bin-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin
          key: cargo-bin-macos-diesel-3.2

      - name: Run migrations
        run: cd server && diesel migration run
        env:
          DATABASE_URL: postgres://ramekin@localhost:5432/ramekin_ios

      - name: Build server
        timeout-minutes: 20
        run: make server-release-build
        env:
          LIBRARY_PATH: /opt/homebrew/opt/postgresql@16/lib
          PQ_LIB_DIR: /opt/homebrew/opt/postgresql@16/lib

      - name: Build CLI
        timeout-minutes: 15
        # This CLI only seeds test data. Avoid a second optimized Rust build
        # consuming the job budget on a cold cache.
        run: make cli/target/debug/ramekin-cli
        env:
          LIBRARY_PATH: /opt/homebrew/opt/postgresql@16/lib
          PQ_LIB_DIR: /opt/homebrew/opt/postgresql@16/lib

      - name: Start mock AI service
        run: |
          mkdir -p logs
          make mock-openrouter MOCK_OPENROUTER_PORT=55002 > logs/mock-openrouter.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:55002/ > /dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat logs/mock-openrouter.log
          exit 1

      - name: Start server
        run: |
          cd server
          ./target/release/ramekin-server &
          # Wait for server to be ready
          for i in {1..60}; do
            if curl -s http://localhost:55000/api/test/unauthed-ping > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server..."
            sleep 1
          done
        env:
          DATABASE_URL: postgres://ramekin@localhost:5432/ramekin_ios
          PORT: 55000
          RUST_LOG: error
          INSECURE_PASSWORD_HASHING: 1
          OPENROUTER_API_KEY: test-key
          RAMEKIN_AI_BASE_URL: http://localhost:55002/v1
          RAMEKIN_AI_RATE_LIMIT_MS: 0

      - name: Seed database
        timeout-minutes: 10
        run: |
          ./cli/target/debug/ramekin-cli seed \
            --server-url http://localhost:55000 \
            --username t --password t \
            --tags-file data/eval-tags.json \
            --preserve-tags=false \
            data/dev/seed.paprikarecipes

      - name: Verify seeded recipes are queryable
        run: |
          # Imports run as async server-side jobs; fail here with a clear
          # message if they didn't produce recipes, instead of letting the UI
          # test fail later with an empty recipe list.
          TOKEN=$(curl -s -X POST http://localhost:55000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"t","password":"t"}' \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          for i in {1..24}; do
            TOTAL=$(curl -s "http://localhost:55000/api/recipes?limit=1" \
              -H "Authorization: Bearer $TOKEN" \
              | python3 -c 'import sys, json; print(json.load(sys.stdin)["pagination"]["total"])')
            if [ "$TOTAL" -gt 0 ] 2>/dev/null; then
              echo "Seeded recipes queryable: total=$TOTAL"
              exit 0
            fi
            echo "No recipes queryable yet (total=$TOTAL), waiting... ($i/24)"
            sleep 5
          done
          echo "Seeded recipes never became queryable — import jobs likely failed"
          exit 1

      - name: Prepare simulator
        timeout-minutes: 10
        # Boot a base-model iPhone up front and turn off keyboard extras; see
        # the script. Exports IOS_UI_DESTINATION, which make ios-test-ui uses.
        run: scripts/prepare-ios-ui-simulator.sh >> "$GITHUB_ENV"

      - name: Start runner load sampler
        # A degraded simulator can stop answering accessibility queries for
        # minutes (SpringBoard kAXErrorIPCTimeout). Record runner CPU and
        # memory through the UI tests so a failure shows whether the runner
        # was starved at the time.
        run: |
          # GitHub runs steps with -eo pipefail; ps | head can exit with
          # SIGPIPE, which must not end the sampler.
          (set +eo pipefail; while true; do
            echo "== $(date -u +%H:%M:%S) $(uptime | sed 's/.*load/load/')"
            memory_pressure -Q | tail -1
            ps -Ao pcpu,rss,comm -r | head -12
            sleep 15
          done) > logs/runner-load.log 2>&1 &

      - name: Run UI tests
        timeout-minutes: 25
        run: make ios-test-ui

      - name: Collect simulator system log
        if: failure()
        timeout-minutes: 5
        # The xcresult only has the test runner's side of a stall; the
        # simulator's own log shows what SpringBoard and the app were doing.
        run: |
          xcrun simctl spawn "$IOS_UI_UDID" log show --last 40m --style compact \
            > logs/simulator-system.log 2>&1 || true
          gzip -f logs/simulator-system.log

      - name: Upload UI test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: |
            logs/*.xcresult
            logs/runner-load.log
            logs/simulator-system.log.gz
          if-no-files-found: ignore
