[package]
name = "ramekin-core"
version = "0.1.0"
edition = "2021"
authors = ["Gregor Stocks"]
license = "LicenseRef-Proprietary"

[dependencies]
# Ingredient density lookup
ingredient-density = { path = "../ingredient-density" }
# HTML parsing
scraper = "0.27"

# Regex for fast JSON-LD extraction
regex = "1"

# HTML entity decoding
html-escape = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# URL parsing
url = "2.5"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

# Async trait for HttpClient
async-trait = "0.1"

# Concurrent hashmap for rate limiter
dashmap = "6.2"

# Timestamps for cache metadata
chrono = { version = "0.4", features = ["serde"] }

# Home directory for cache path
dirs = "6.0"

# Async runtime for rate limiter sleep
tokio = { version = "1", features = ["time"] }

# Logging
tracing = "0.1"

# UUIDs for photo IDs
uuid = { version = "1.23", features = ["v4", "serde"] }

# AI client (OpenAI-compatible API for OpenRouter).
# We use openai-api-rs rather than async-openai because async-openai
# strict-types OpenAI's exact spec (e.g. ServiceTier enum) and breaks on
# OpenRouter's extension values like service_tier="standard".
openai-api-rs = "10"

# Hashing for cache keys
sha2 = "0.11"

# Image format detection and validation
image = "0.25"

# Character encoding detection and transcoding
encoding_rs = "0.8"

[build-dependencies]
uuid = { version = "1.23", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1.4"
glob = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
