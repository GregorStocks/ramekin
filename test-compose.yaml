version: "0.5"
extends: compose/test-base.yaml

log_location: ./logs/test.log

processes:
  rust-tests-server:
    command: |
      echo "[TIMING] rust-tests-server starting at $(date +%H:%M:%S)"
      START=$(date +%s)
      cargo test -q --manifest-path server/Cargo.toml
      EXIT_CODE=$?
      printf '%s\n' "$EXIT_CODE" > ${TEST_STATUS_DIR}/rust-tests-server.exit
      echo "[TIMING] rust-tests-server completed in $(($(date +%s) - START))s"
      exit $EXIT_CODE
    availability:
      restart: "no"

  rust-tests-cli:
    command: |
      echo "[TIMING] rust-tests-cli starting at $(date +%H:%M:%S)"
      START=$(date +%s)
      cargo test -q --manifest-path cli/Cargo.toml
      EXIT_CODE=$?
      printf '%s\n' "$EXIT_CODE" > ${TEST_STATUS_DIR}/rust-tests-cli.exit
      echo "[TIMING] rust-tests-cli completed in $(($(date +%s) - START))s"
      exit $EXIT_CODE
    availability:
      restart: "no"

  rust-tests-core:
    command: |
      echo "[TIMING] rust-tests-core starting at $(date +%H:%M:%S)"
      START=$(date +%s)
      cargo test -q --manifest-path ramekin-core/Cargo.toml
      EXIT_CODE=$?
      printf '%s\n' "$EXIT_CODE" > ${TEST_STATUS_DIR}/rust-tests-core.exit
      echo "[TIMING] rust-tests-core completed in $(($(date +%s) - START))s"
      exit $EXIT_CODE
    availability:
      restart: "no"

  ui-unit-tests:
    command: |
      echo "[TIMING] ui-unit-tests starting at $(date +%H:%M:%S)"
      START=$(date +%s)
      make ui-unit-test
      EXIT_CODE=$?
      printf '%s\n' "$EXIT_CODE" > ${TEST_STATUS_DIR}/ui-unit-tests.exit
      echo "[TIMING] ui-unit-tests completed in $(($(date +%s) - START))s"
      exit $EXIT_CODE
    availability:
      restart: "no"

  api-tests:
    command: |
      echo "[TIMING] api-tests starting at $(date +%H:%M:%S)"
      START=$(date +%s)
      pytest tests -v -n auto --ignore=tests/ui
      EXIT_CODE=$?
      printf '%s\n' "$EXIT_CODE" > ${TEST_STATUS_DIR}/api-tests.exit
      echo "[TIMING] api-tests completed in $(($(date +%s) - START))s"
      exit $EXIT_CODE
    environment:
      - FIXTURE_BASE_URL=http://localhost:${FIXTURE_PORT}
      - API_BASE_URL=http://localhost:${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - CLI_PATH=./cli/target/debug/ramekin-cli
      - PYTHONPATH=./tests/generated
    availability:
      restart: "no"
    depends_on:
      server:
        condition: process_healthy

  all-tests:
    command: echo "All tests completed successfully"
    availability:
      restart: "no"
      exit_on_end: true
      exit_on_skipped: true
    depends_on:
      rust-tests-server:
        condition: process_completed_successfully
      rust-tests-cli:
        condition: process_completed_successfully
      rust-tests-core:
        condition: process_completed_successfully
      api-tests:
        condition: process_completed_successfully
      ui-unit-tests:
        condition: process_completed_successfully
