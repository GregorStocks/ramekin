version: "0.5"
extends: compose/test-base.yaml

log_location: ./logs/test-ui.log

processes:
  ui:
    command: npm run dev -- --port ${UI_PORT} --strictPort
    working_dir: ./ramekin-ui
    environment:
      - PORT=${PORT}
      - UI_PORT_HTTP=${UI_PORT_HTTP}
    readiness_probe:
      http_get:
        host: localhost
        port: ${UI_PORT_HTTP}
        path: /
    depends_on:
      server:
        condition: process_healthy

  seed:
    command: |
      echo "[TIMING] seed starting at $(date +%H:%M:%S)"
      START=$(date +%s)
      cargo run -q -- seed \
        --server-url http://localhost:${PORT} \
        --username t --password t \
        ../data/dev/seed.paprikarecipes
      echo "[TIMING] seed completed in $(($(date +%s) - START))s"
    working_dir: ./cli
    availability:
      restart: "no"
    depends_on:
      server:
        condition: process_healthy

  ui-tests:
    command: |
      echo "[TIMING] ui-tests starting at $(date +%H:%M:%S)"
      START=$(date +%s)
      pytest tests/ui -v
      EXIT_CODE=$?
      echo "[TIMING] ui-tests completed in $(($(date +%s) - START))s"
      exit $EXIT_CODE
    environment:
      - API_BASE_URL=http://localhost:${PORT}
      - FIXTURE_BASE_URL=http://localhost:${FIXTURE_PORT}
      - PYTHONPATH=./tests/generated
      - UI_BASE_URL=http://localhost:${UI_PORT_HTTP}
    availability:
      restart: "no"
      exit_on_end: true
      exit_on_skipped: true
    depends_on:
      seed:
        condition: process_completed_successfully
      ui:
        condition: process_healthy
