<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI eval results</title>
<style>
  :root {
    --bg: #fafaf8; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --border: #ddddd6;
    --best: #2f7d32; --good: #4a6fa5; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ececea; --muted: #a0a09a; --border: #3a3a36;
      --best: #7cc97f; --good: #8fb0e0; --bad: #f08a80;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  button { font: inherit; font-size: 14px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; }
  button.on { background: var(--text); color: var(--bg); }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  section h2 { font-size: 16px; margin: 0 0 12px; }
  .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 12px; }
  .single .answers { grid-template-columns: minmax(0, 1fr); max-width: 1000px; }
  .answer { border: 2px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .answer.best { border-color: var(--best); } .answer.good { border-color: var(--good); } .answer.bad { border-color: var(--bad); }
  .answer[hidden] { display: none; }
  .label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .model { font-weight: 600; overflow-wrap: anywhere; }
  .verdict { font-weight: 600; }
  .best .verdict { color: var(--best); } .good .verdict { color: var(--good); } .bad .verdict { color: var(--bad); }
  .answer img { width: 100%; border-radius: 6px; }
  .answer pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 ui-monospace, monospace; margin: 0;
    max-height: 420px; overflow: auto; }
  .missing { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div id="filters"></div>
</header>
<main id="cases"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
document.getElementById("title").textContent = "Results: " + DATA.suite;

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of children) node.append(child);
  return node;
};

// Each model's answer and your verdict, case by case; the buttons show one
// model's answers at a time (or all side by side).
const main = document.getElementById("cases");
for (const c of DATA.cases) {
  const grid = el("div", { className: "answers" });
  for (const { model, answer, verdict } of c.answers) {
    const card = el("div", { className: "answer " + (verdict || "") });
    card.dataset.model = model;
    card.append(el("div", { className: "label" }, [
      el("span", { className: "model", textContent: model }),
      el("span", { className: "verdict", textContent: answer ? (verdict || "unjudged") : "" }),
    ]));
    if (!answer) card.append(el("div", { className: "missing", textContent: "No answer (failed or refused)" }));
    else if (answer.image) card.append(el("a", { href: answer.image, target: "_blank" }, [
      el("img", { src: answer.image, loading: "lazy", alt: model + " photo of " + c.title }),
    ]));
    else card.append(el("pre", { textContent: answer.text }));
    grid.append(card);
  }
  main.append(el("section", {}, [el("h2", { textContent: c.title }), grid]));
}

const filters = document.getElementById("filters");
function show(model) {
  document.body.classList.toggle("single", model !== null);
  for (const card of document.querySelectorAll(".answer"))
    card.hidden = model !== null && card.dataset.model !== model;
  for (const button of filters.querySelectorAll("button"))
    button.classList.toggle("on", button.dataset.model === String(model));
  try { localStorage.setItem("ai-eval-results:" + DATA.suite, model ?? ""); } catch (e) {}
}
filters.append(el("button", { textContent: "All", onclick: () => show(null) }));
filters.lastChild.dataset.model = "null";
for (const model of DATA.models) {
  const button = el("button", { textContent: model, onclick: () => show(model) });
  button.dataset.model = model;
  filters.append(button);
}
let saved = null;
try { saved = localStorage.getItem("ai-eval-results:" + DATA.suite) || null; } catch (e) {}
show(DATA.models.includes(saved) ? saved : null);
</script>
</body>
</html>
