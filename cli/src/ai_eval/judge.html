<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI eval judging</title>
<style>
  :root {
    --bg: #fafaf8; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --border: #ddddd6;
    --added: #e3f4e1; --best: #2f7d32; --good: #4a6fa5; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ececea; --muted: #a0a09a; --border: #3a3a36;
      --added: #23402a; --best: #7cc97f; --good: #8fb0e0; --bad: #f08a80;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--muted); flex: 1 1 320px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  section h2 { font-size: 16px; margin: 0 0 8px; overflow-wrap: anywhere; }
  .instruction { font-weight: 600; margin: 0 0 8px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 ui-monospace, monospace; margin: 0; }
  details { margin-bottom: 12px; color: var(--muted); }
  .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .answer { border: 2px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .answer.best { border-color: var(--best); } .answer.good { border-color: var(--good); } .answer.bad { border-color: var(--bad); }
  .answer .text { font-size: 15px; white-space: pre-wrap; }
  .answer pre .added { background: var(--added); display: block; }
  .answers.images { grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); }
  .answer img { width: 100%; border-radius: 6px; cursor: zoom-in; }
  #viewer { position: fixed; inset: 0; z-index: 2; background: rgba(0, 0, 0, 0.92); color: #fff;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  #viewer.open { display: flex; }
  #viewer img { max-width: 100%; max-height: calc(100vh - 120px); object-fit: contain; border-radius: 6px; cursor: default; }
  #viewer .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #viewer button { background: #2a2a28; color: #fff; border-color: #555; }
  #viewer button.on { background: #fff; color: #000; }
  #viewer .hint { color: #aaa; font-size: 13px; }
  .verdicts { display: flex; gap: 12px; margin-top: auto; }
  .verdicts label { cursor: pointer; }
  .tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 12px; }
  .tags label { cursor: pointer; }
  .tags .none { grid-column: 1 / -1; color: var(--muted); }
  .done { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="help"></p>
  <span id="progress"></span>
  <button id="save">Save judgments</button>
</header>
<main id="cases"></main>
<div id="viewer">
  <img alt="Generated photo">
  <div class="bar">
    <span id="viewer-where"></span>
    <button data-verdict="best">1 best</button>
    <button data-verdict="good">2 good</button>
    <button data-verdict="bad">3 bad</button>
  </div>
  <div class="hint">← → previous / next photo · 1 2 3 judge and move on · Esc close</div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const STORE = "ai-eval-judging:" + DATA.suite;
let picks = {};
try { picks = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(picks)); } catch (e) {} };

document.getElementById("title").textContent = "Judge: " + DATA.suite;
document.getElementById("help").textContent = DATA.kind === "tags"
  ? "Tick every tag that applies to each recipe (or “none apply”). Then save: this writes data/ai-evals/judgments/" + DATA.suite + ".json when served by make ai-eval-judge, or copies the JSON to paste there."
  : "Mark each answer best, good or bad; several can be best. Model names are hidden and identical answers are merged. Then save: this writes data/ai-evals/judgments/" + DATA.suite + ".json when served by make ai-eval-judge, or copies the JSON to paste there.";

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of children) node.append(child);
  return node;
};

function progress() {
  let done = 0, total = 0;
  for (const c of DATA.cases) {
    if (DATA.kind === "tags") { total++; if (picks[c.id]) done++; }
    else for (const a of c.answers) { total++; if (picks[c.id]?.[a.key]) done++; }
  }
  document.getElementById("progress").textContent = `${done} / ${total} judged`;
}

// An answer's text with the lines the original doesn't have highlighted.
function diffed(text, original) {
  const pre = el("pre");
  const kept = new Set(original.split("\n").map(l => l.trim()));
  for (const line of text.split("\n")) {
    const span = el("span", { textContent: line + "\n" });
    if (line.trim() && !kept.has(line.trim())) span.className = "added";
    pre.append(span);
  }
  return pre;
}

// Every photo on the page, in order, for the full-screen viewer.
const photos = [];

// Records a verdict for an answer and shows it on its card.
function judge(c, a, card, verdict) {
  (picks[c.id] ||= {})[a.key] = verdict;
  card.className = "answer " + verdict;
  for (const input of card.querySelectorAll("input")) input.checked = input.value === verdict;
  save(); progress();
}

const viewer = document.getElementById("viewer");
let viewing = 0;
function view(index) {
  viewing = (index + photos.length) % photos.length;
  const { c, a } = photos[viewing];
  viewer.querySelector("img").src = a.image;
  const sameCase = photos.filter(p => p.c === c);
  document.getElementById("viewer-where").textContent =
    `${c.source.split("\n")[0]} \u00b7 photo ${sameCase.findIndex(p => p.a === a) + 1} of ${sameCase.length}`;
  for (const button of viewer.querySelectorAll("button"))
    button.classList.toggle("on", picks[c.id]?.[a.key] === button.dataset.verdict);
  viewer.classList.add("open");
}
const close = () => viewer.classList.remove("open");
function verdictInViewer(verdict) {
  const { c, a, card } = photos[viewing];
  judge(c, a, card, verdict);
  view(viewing + 1);
}
for (const button of viewer.querySelectorAll("button"))
  button.onclick = () => verdictInViewer(button.dataset.verdict);
viewer.onclick = e => { if (e.target === viewer) close(); };
document.addEventListener("keydown", e => {
  if (!viewer.classList.contains("open")) return;
  if (e.key === "Escape") close();
  else if (e.key === "ArrowRight") view(viewing + 1);
  else if (e.key === "ArrowLeft") view(viewing - 1);
  else if (["1", "2", "3"].includes(e.key)) verdictInViewer(["best", "good", "bad"][Number(e.key) - 1]);
});

const main = document.getElementById("cases");
if (!DATA.cases.length) main.append(el("p", { className: "done", textContent: "Nothing left to judge." }));
for (const c of DATA.cases) {
  const section = el("section", {}, [el("h2", { textContent: c.id })]);
  if (c.instruction) section.append(el("p", { className: "instruction", textContent: "Instruction: " + c.instruction }));
  section.append(el("details", { open: DATA.kind === "tags" }, [
    el("summary", { textContent: "Source recipe" }), el("pre", { textContent: c.source }),
  ]));
  if (DATA.kind === "tags") {
    const box = el("div", { className: "tags" });
    const chosen = new Set(picks[c.id]?.tags || []);
    const none = el("input", { type: "checkbox", checked: picks[c.id] && chosen.size === 0 });
    const inputs = [];
    const update = () => {
      const tags = inputs.filter(i => i.checked).map(i => i.value);
      if (tags.length) none.checked = false;
      if (tags.length || none.checked) picks[c.id] = { tags }; else delete picks[c.id];
      save(); progress();
    };
    for (const tag of DATA.vocabulary) {
      const input = el("input", { type: "checkbox", value: tag, checked: chosen.has(tag), onchange: update });
      inputs.push(input);
      box.append(el("label", {}, [input, " " + tag]));
    }
    none.onchange = () => { if (none.checked) inputs.forEach(i => (i.checked = false)); update(); };
    box.append(el("label", { className: "none" }, [none, " None apply"]));
    section.append(box);
  } else {
    const grid = el("div", { className: c.answers.some(a => a.image) ? "answers images" : "answers" });
    for (const a of c.answers) {
      const card = el("div", { className: "answer " + (picks[c.id]?.[a.key] || "") });
      if (a.image) {
        const index = photos.length;
        photos.push({ c, a, card });
        card.append(el("img", { src: a.image, loading: "lazy", alt: "Generated photo", onclick: () => view(index) }));
      }
      else if (c.original) card.append(diffed(a.text, c.original));
      else card.append(el("div", { className: "text", textContent: a.text }));
      const row = el("div", { className: "verdicts" });
      for (const verdict of ["best", "good", "bad"]) {
        const input = el("input", {
          type: "radio", name: c.id + "/" + a.key, value: verdict,
          checked: picks[c.id]?.[a.key] === verdict,
          onchange: () => judge(c, a, card, verdict),
        });
        row.append(el("label", {}, [input, " " + verdict]));
      }
      card.append(row);
      grid.append(card);
    }
    section.append(grid);
  }
  main.append(section);
}
progress();

// Sorted keys and two-space indent, as the Rust side writes JSON.
function sorted(value) {
  if (Array.isArray(value)) return value.map(sorted);
  if (value && typeof value === "object")
    return Object.fromEntries(Object.keys(value).sort().map(k => [k, sorted(value[k])]));
  return value;
}

document.getElementById("save").onclick = async () => {
  const merged = structuredClone(DATA.existing);
  for (const c of DATA.cases) {
    if (DATA.kind === "tags") {
      if (picks[c.id]) merged[c.id] = picks[c.id].tags;
      continue;
    }
    for (const a of c.answers) {
      const verdict = picks[c.id]?.[a.key];
      if (!verdict) continue;
      const judgment = { verdict };
      if (DATA.keepText && a.text) judgment.answer = a.text;
      (merged[c.id] ||= {})[a.key] = judgment;
    }
  }
  const json = JSON.stringify(sorted(merged), null, 2) + "\n";
  // Served by `make ai-eval-judge`, the judgments are saved straight into
  // the repo; otherwise they're copied to the clipboard, to paste there.
  const button = document.getElementById("save");
  try {
    const response = await fetch("/judgments/" + DATA.suite + ".json", { method: "PUT", body: json });
    if (response.ok) {
      button.textContent = "\u2713 Saved " + new Date().toLocaleTimeString();
      return;
    }
  } catch (e) {}
  // navigator.clipboard needs a secure context, which a plain-http page on
  // another machine isn't, so fall back to a selected textarea.
  try {
    await navigator.clipboard.writeText(json);
  } catch (e) {
    const area = el("textarea", { value: json });
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  button.textContent = "\u2713 Copied JSON for data/ai-evals/judgments/" + DATA.suite + ".json";
};
</script>
</body>
</html>
