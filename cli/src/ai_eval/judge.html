<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI eval judging</title>
<style>
  :root {
    --bg: #fafaf8; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --border: #ddddd6;
    --added: #e3f4e1; --best: #2f7d32; --good: #4a6fa5; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --card: #20201e; --text: #ececea; --muted: #a0a09a; --border: #3a3a36;
      --added: #23402a; --best: #7cc97f; --good: #8fb0e0; --bad: #f08a80;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--muted); flex: 1 1 320px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px; }
  section { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  section h2 { font-size: 16px; margin: 0 0 8px; overflow-wrap: anywhere; }
  .instruction { font-weight: 600; margin: 0 0 8px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.45 ui-monospace, monospace; margin: 0; }
  details { margin-bottom: 12px; color: var(--muted); }
  .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .answer { border: 2px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .answer.best { border-color: var(--best); } .answer.good { border-color: var(--good); } .answer.bad { border-color: var(--bad); }
  .answer .text { font-size: 15px; white-space: pre-wrap; }
  .answer pre .added { background: var(--added); display: block; }
  .answer img { width: 100%; border-radius: 6px; }
  .verdicts { display: flex; gap: 12px; margin-top: auto; }
  .verdicts label { cursor: pointer; }
  .tags { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 12px; }
  .tags label { cursor: pointer; }
  .tags .none { grid-column: 1 / -1; color: var(--muted); }
  .done { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="help"></p>
  <span id="progress"></span>
  <button id="download">Download judgments</button>
</header>
<main id="cases"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const STORE = "ai-eval-judging:" + DATA.suite;
let picks = {};
try { picks = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(picks)); } catch (e) {} };

document.getElementById("title").textContent = "Judge: " + DATA.suite;
document.getElementById("help").textContent = DATA.kind === "tags"
  ? "Tick every tag that applies to each recipe (or “none apply”). Then download and save as data/ai-evals/judgments/" + DATA.suite + ".json."
  : "Mark each answer best, good or bad; several can be best. Model names are hidden and identical answers are merged. Then download and save as data/ai-evals/judgments/" + DATA.suite + ".json.";

const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const child of children) node.append(child);
  return node;
};

function progress() {
  let done = 0, total = 0;
  for (const c of DATA.cases) {
    if (DATA.kind === "tags") { total++; if (picks[c.id]) done++; }
    else for (const a of c.answers) { total++; if (picks[c.id]?.[a.key]) done++; }
  }
  document.getElementById("progress").textContent = `${done} / ${total} judged`;
}

// An answer's text with the lines the original doesn't have highlighted.
function diffed(text, original) {
  const pre = el("pre");
  const kept = new Set(original.split("\n").map(l => l.trim()));
  for (const line of text.split("\n")) {
    const span = el("span", { textContent: line + "\n" });
    if (line.trim() && !kept.has(line.trim())) span.className = "added";
    pre.append(span);
  }
  return pre;
}

const main = document.getElementById("cases");
if (!DATA.cases.length) main.append(el("p", { className: "done", textContent: "Nothing left to judge." }));
for (const c of DATA.cases) {
  const section = el("section", {}, [el("h2", { textContent: c.id })]);
  if (c.instruction) section.append(el("p", { className: "instruction", textContent: "Instruction: " + c.instruction }));
  section.append(el("details", { open: DATA.kind === "tags" }, [
    el("summary", { textContent: "Source recipe" }), el("pre", { textContent: c.source }),
  ]));
  if (DATA.kind === "tags") {
    const box = el("div", { className: "tags" });
    const chosen = new Set(picks[c.id]?.tags || []);
    const none = el("input", { type: "checkbox", checked: picks[c.id] && chosen.size === 0 });
    const inputs = [];
    const update = () => {
      const tags = inputs.filter(i => i.checked).map(i => i.value);
      if (tags.length) none.checked = false;
      if (tags.length || none.checked) picks[c.id] = { tags }; else delete picks[c.id];
      save(); progress();
    };
    for (const tag of DATA.vocabulary) {
      const input = el("input", { type: "checkbox", value: tag, checked: chosen.has(tag), onchange: update });
      inputs.push(input);
      box.append(el("label", {}, [input, " " + tag]));
    }
    none.onchange = () => { if (none.checked) inputs.forEach(i => (i.checked = false)); update(); };
    box.append(el("label", { className: "none" }, [none, " None apply"]));
    section.append(box);
  } else {
    const grid = el("div", { className: "answers" });
    for (const a of c.answers) {
      const card = el("div", { className: "answer " + (picks[c.id]?.[a.key] || "") });
      if (a.image) card.append(el("img", { src: a.image, loading: "lazy", alt: "Generated photo" }));
      else if (c.original) card.append(diffed(a.text, c.original));
      else card.append(el("div", { className: "text", textContent: a.text }));
      const row = el("div", { className: "verdicts" });
      for (const verdict of ["best", "good", "bad"]) {
        const input = el("input", {
          type: "radio", name: c.id + "/" + a.key, value: verdict,
          checked: picks[c.id]?.[a.key] === verdict,
          onchange: () => {
            (picks[c.id] ||= {})[a.key] = verdict;
            card.className = "answer " + verdict;
            save(); progress();
          },
        });
        row.append(el("label", {}, [input, " " + verdict]));
      }
      card.append(row);
      grid.append(card);
    }
    section.append(grid);
  }
  main.append(section);
}
progress();

// Sorted keys and two-space indent, as the Rust side writes JSON.
function sorted(value) {
  if (Array.isArray(value)) return value.map(sorted);
  if (value && typeof value === "object")
    return Object.fromEntries(Object.keys(value).sort().map(k => [k, sorted(value[k])]));
  return value;
}

document.getElementById("download").onclick = () => {
  const merged = structuredClone(DATA.existing);
  for (const c of DATA.cases) {
    if (DATA.kind === "tags") {
      if (picks[c.id]) merged[c.id] = picks[c.id].tags;
      continue;
    }
    for (const a of c.answers) {
      const verdict = picks[c.id]?.[a.key];
      if (!verdict) continue;
      const judgment = { verdict };
      if (DATA.keepText && a.text) judgment.answer = a.text;
      (merged[c.id] ||= {})[a.key] = judgment;
    }
  }
  const blob = new Blob([JSON.stringify(sorted(merged), null, 2) + "\n"], { type: "application/json" });
  const link = el("a", { href: URL.createObjectURL(blob), download: DATA.suite + ".json" });
  document.body.append(link);
  link.click();
  link.remove();
};
</script>
</body>
</html>
