version: "0.5"
extends: base.yaml

processes:
  fixture:
    command: python3 ../fixture_server.py ${FIXTURE_PORT}
    working_dir: ${PWD}/tests/scrape_fixtures
    readiness_probe:
      http_get:
        host: localhost
        port: ${FIXTURE_PORT}
        path: /

  mock-openrouter:
    command: python3 tests/mock_openrouter.py ${MOCK_OPENROUTER_PORT}
    working_dir: ${PWD}
    readiness_probe:
      http_get:
        host: localhost
        port: ${MOCK_OPENROUTER_PORT}
        path: /

  server:
    working_dir: ${PWD}/server
    environment:
      - SCRAPE_ALLOWED_HOSTS=localhost:${FIXTURE_PORT}
      - OPENROUTER_API_KEY=test-api-key
      - RAMEKIN_AI_BASE_URL=http://localhost:${MOCK_OPENROUTER_PORT}/v1
      - RAMEKIN_AI_CACHE_DIR=../logs/test-ai-cache
      - RAMEKIN_CLIENT_LOG_DIR=../logs/test-client-logs
    depends_on:
      fixture:
        condition: process_healthy
      mock-openrouter:
        condition: process_healthy
